# ─────────────────────────────────────────────────────────────────────────────
# dojo.layerflow.dev — Layerflow (DI-01 Debug Dojo) on a SHARED rootless-Docker box
#
#   cd ~/apps/dojo && docker compose -f deploy/docker-compose.dojo.yml up -d --build
#
# House rules of the box (see ~/WELCOME.txt): no sudo · rootless Docker ·
# container ports only in 3100–3200 · a memory budget per user. 3100 and 3200
# belong to layerflow.dev, so this uses 3150 — bound to localhost, reached only
# through Caddy (deploy/apply-dojo-route.py adds the route).
#
# ONE port serves the website AND the app: the website proxies /api/* to the
# API inside the same container. App base URL: https://dojo.layerflow.dev/api
# ─────────────────────────────────────────────────────────────────────────────
services:
  dojo:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dojo/layerflow:latest
    container_name: dojo-web
    init: true
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      LAYERFLOW_API_PORT: "4000"
      LAYERFLOW_API_HOST: 127.0.0.1
      LAYERFLOW_PUBLIC_URL: https://dojo.layerflow.dev
      # a small sandbox pool — this box is shared (each runner is a Node + Pyodide process)
      LAYERFLOW_WARM: "2"
      LAYERFLOW_MAX_RUNNERS: "2"
      LAYERFLOW_MEM_MB: "160"
      # judging: no Free-plan daily caps; per-device limits still protect the AI keys
      LAYERFLOW_LIMITS: "off"
      LAYERFLOW_RATE_RUN: "600"
      LAYERFLOW_RATE_AI: "60"
      LAYERFLOW_CHECKOUT: demo
    ports:
      - "127.0.0.1:3150:3000"
    volumes:
      - dojo-data:/app/apps/api/data
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  dojo-data:

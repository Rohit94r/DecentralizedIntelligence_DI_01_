# ─────────────────────────────────────────────────────────────────────────────
# Debug Dojo — nginx reverse proxy (optional: only if you want HTTPS/a domain)
#
# If you have no domain, you do NOT need this. Just set PORT=3000 and use
# http://<vps-ip>:3000. Everything else works.
#
# With a domain:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/debug-dojo
#   sudo ln -s /etc/nginx/sites-available/debug-dojo /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d your.domain        # free HTTPS in 30 seconds
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

upstream debug_dojo {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name your.domain;          # or _ ; if you only use the IP

    # ── the sandbox is genuinely slow: Pyodide boot + a hard-timeout run can
    #    legitimately take 20-90 seconds. The default 60s proxy read timeout
    #    would cut judges off mid-test.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_connect_timeout 20s;

    client_max_body_size 2m;

    location / {
        proxy_pass         http://debug_dojo;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;   # websockets (mentor chat)
        proxy_set_header   Connection        "upgrade";
    }
}
# ─────────────────────────────────────────────────────────────────────────────
# Layerflow (Debug Dojo) — ONE server for the website AND the app
#
#   https://your.domain/        → the website  (Next.js, 127.0.0.1:3000)
#   https://your.domain/api/*   → the API      (Fastify, 127.0.0.1:4000)
#                                  used by the website AND the mobile/companion app
#
# The app needs HTTPS (Android and iOS block plain http by default), so use a domain:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/layerflow
#   sudo sed -i 's/your.domain/YOUR-REAL-DOMAIN/' /etc/nginx/sites-available/layerflow
#   sudo ln -s /etc/nginx/sites-available/layerflow /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR-REAL-DOMAIN       # free HTTPS; adds the 443 block + redirect
#
# Then in the systemd unit uncomment WEB_HOST=127.0.0.1, so the website is only
# reachable through nginx. The API already listens on 127.0.0.1 only.
# ─────────────────────────────────────────────────────────────────────────────

upstream layerflow_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream layerflow_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# "Connection: upgrade" only when the client asks for it (keeps keepalive working)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name your.domain;          # e.g. layerflow.in  (or _ ; for the bare IP)

    # The sandbox can legitimately take 20–90 s on a hostile program, and an
    # answer is checked against every test before it is sent. Don't cut it off.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_connect_timeout 20s;

    # voice recordings for speech-to-text are up to 8 MB
    client_max_body_size 10m;

    # ── the API: website + app ──
    location /api/ {
        proxy_pass         http://layerflow_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;   # per-device limits use the real IP
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── the website ──
    location / {
        proxy_pass         http://layerflow_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    # long-lived caching for the website's build assets (file names change on every build)
    location /_next/static/ {
        proxy_pass http://layerflow_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

